[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vadeval"
version = "0.1.0"
description = "Evaluation toolkit for video anomaly detection: ROC-AUC, AP and false alarms per shift"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "[Student name]" }]
keywords = ["anomaly detection", "video surveillance", "evaluation", "metrics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
vadeval = "vadeval.cli:main"

[project.urls]
Repository = "https://github.com/<catsday>/vad-eval"
Issues = "https://github.com/<catsday>/vad-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vadeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["vadeval"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
